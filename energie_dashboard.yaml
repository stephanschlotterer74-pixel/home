      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 18 · HAUSGERÄTE (Waschmaschine + Spülmaschine) │
      # └─────────────────────────────────────────────────────────┘
      - type: horizontal-stack
        cards:
          - type: custom:stack-in-card
            mode: vertical
            cards:
              - type: markdown
                content: "### 🫧 Waschmaschine"
              - type: custom:mushroom-template-card
                primary: >
                  {% if is_state('binary_sensor.waschmaschine', 'on') %}Läuft
                  {% elif is_state('binary_sensor.waschmaschine', 'off') %}Bereit
                  {% else %}Nicht verfügbar{% endif %}
                secondary: >
                  {% if states('sensor.waschmaschine_fortschritt') != 'unavailable' %}
                    Fortschritt: {{ states('sensor.waschmaschine_fortschritt') }}%
                  {% else %}–{% endif %}
                icon: mdi:washing-machine
                icon_color: >
                  {% if is_state('binary_sensor.waschmaschine', 'on') %}blue{% else %}grey{% endif %}
                entity: binary_sensor.waschmaschine
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: sensor.waschmaschine_leistung
                    name: Leistung
                    icon: mdi:lightning-bolt
                  - entity: sensor.waschmaschine_restdauer
                    name: Restdauer
                    icon: mdi:timer-outline
                  - entity: switch.shellyplugn
                    name: Steckdose
                    icon: mdi:power-socket-eu

          - type: custom:stack-in-card
            mode: vertical
            cards:
              - type: markdown
                content: "### 🍽️ Spülmaschine"
              - type: custom:mushroom-template-card
                primary: >
                  {% if is_state('binary_sensor.spuelmaschine_laeuft', 'on') %}Läuft
                  {% elif is_state('binary_sensor.spuelmaschine_laeuft', 'off') %}Bereit
                  {% else %}Nicht verfügbar{% endif %}
                secondary: >
                  {% if states('sensor.spuelmaschine_fortschritt') != 'unavailable' %}
                    Fortschritt: {{ states('sensor.spuelmaschine_fortschritt') }}%
                  {% else %}–{% endif %}
                icon: mdi:dishwasher
                icon_color: >
                  {% if is_state('binary_sensor.spuelmaschine_laeuft', 'on') %}cyan{% else %}grey{% endif %}
                entity: binary_sensor.spuelmaschine_laeuft
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: sensor.spuelmaschine_leistung
                    name: Leistung
                    icon: mdi:lightning-bolt
                  - entity: sensor.spuelmaschine_restdauer
                    name: Restdauer
                    icon: mdi:timer-outline
