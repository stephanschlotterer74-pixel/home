# ═══════════════════════════════════════════════════════════════════
#  ⚡ STESCH ENERGIE-DASHBOARD v2 – Lovelace YAML
#  Erstellt: 2026-06-05 | Update: 2026-06-21
# ───────────────────────────────────────────────────────────────────
#  BENÖTIGTE HACS-KARTEN:
#  • mushroom-cards        → github.com/piitaya/lovelace-mushroom
#  • apexcharts-card       → github.com/RomRider/apexcharts-card
#  • power-flow-card-plus  → github.com/flixlix/power-flow-card-plus
#  • mini-graph-card       → github.com/kalkih/mini-graph-card
#  • stack-in-card         → github.com/custom-cards/stack-in-card
#  • bar-card              → github.com/custom-cards/bar-card
#
#  HINWEIS: Entity-IDs ggf. anpassen – in HA unter
#  Einstellungen → Geräte & Dienste → Entitäten die echte ID ablesen
# ═══════════════════════════════════════════════════════════════════

title: ⚡ Energie-Dashboard
views:
  - title: Energie
    path: energie
    icon: mdi:lightning-bolt-circle
    subview: false
    badges: []
    cards:

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 1 · LIVE STATUS CHIPS                           │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:solar-power-variant
            content: "{{ states('sensor.solarbank_3_e2700_pro_solarleistung') | int }} W"
            icon_color: amber
          - type: template
            icon: mdi:transmission-tower-import
            content: "{{ states('sensor.smart_meter_netzbezug') | int }} W"
            icon_color: >
              {% if states('sensor.smart_meter_netzbezug') | int > 0 %}red{% else %}green{% endif %}
          - type: template
            icon: mdi:home-lightning-bolt
            content: "{{ states('sensor.system_balkonkraft_stesch_hausbedarf') | int }} W"
            icon_color: indigo
          - type: template
            icon: mdi:battery
            content: "{{ states('sensor.solarbank_3_e2700_pro_ladestand') | int }}%"
            icon_color: >
              {% set s = states('sensor.solarbank_3_e2700_pro_ladestand') | int %}
              {% if s > 70 %}green{% elif s > 30 %}orange{% else %}red{% endif %}
          - type: template
            icon: mdi:leaf
            content: "{{ states('sensor.system_balkonkraft_stesch_co2_einsparung') | float | round(1) }} kg CO₂"
            icon_color: teal

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 2 · LIVE KENNZAHLEN (4 Kacheln)                │
      # └─────────────────────────────────────────────────────────┘
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.solarbank_3_e2700_pro_solarleistung') | int }} W"
            secondary: Solarleistung
            icon: mdi:solar-power-variant
            icon_color: amber
            entity: sensor.solarbank_3_e2700_pro_solarleistung
            layout: vertical
            fill_container: true
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.smart_meter_netzbezug') | int }} W"
            secondary: >
              {% if states('sensor.smart_meter_netzeinspeisung') | int > 0 %}
                ↑ {{ states('sensor.smart_meter_netzeinspeisung') | int }} W eingespeist
              {% else %}Netzbezug{% endif %}
            icon: mdi:transmission-tower
            icon_color: >
              {% if states('sensor.smart_meter_netzbezug') | int > 0 %}red{% else %}green{% endif %}
            entity: sensor.smart_meter_netzbezug
            layout: vertical
            fill_container: true
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.system_balkonkraft_stesch_hausbedarf') | int }} W"
            secondary: Hausbedarf
            icon: mdi:home-lightning-bolt
            icon_color: indigo
            entity: sensor.system_balkonkraft_stesch_hausbedarf
            layout: vertical
            fill_container: true
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.solarbank_3_e2700_pro_ladestand') | int }}%"
            secondary: "{{ states('sensor.solarbank_3_e2700_pro_akkuenergie') | int }} Wh"
            icon: >
              {% set s = states('sensor.solarbank_3_e2700_pro_ladestand') | int %}
              {% if s > 80 %}mdi:battery-charging-high
              {% elif s > 50 %}mdi:battery-charging-medium
              {% elif s > 20 %}mdi:battery-charging-low
              {% else %}mdi:battery-alert{% endif %}
            icon_color: >
              {% set s = states('sensor.solarbank_3_e2700_pro_ladestand') | int %}
              {% if s > 70 %}green{% elif s > 30 %}orange{% else %}red{% endif %}
            entity: sensor.solarbank_3_e2700_pro_ladestand
            layout: vertical
            fill_container: true

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 3 · ENERGIEFLUSS                                │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:power-flow-card-plus
        title: ⚡ Energiefluss – Live
        entities:
          grid:
            entity: sensor.smart_meter_netzbezug
            name: Stromnetz
            secondary_info:
              entity: sensor.smart_meter_netzeinspeisung
              template: "Einspeisung: {0} W"
            color:
              consumption: "#E74C3C"
              production: "#2ECC71"
          solar:
            entity: sensor.solarbank_3_e2700_pro_solarleistung
            name: Solar PV
            color: "#FFB700"
            display_zero_state: true
            secondary_info:
              entity: sensor.solarbank_3_e2700_pro_betriebszustand
          battery:
            entity: sensor.solarbank_3_e2700_pro_batterie_ausgang
            state_of_charge: sensor.solarbank_3_e2700_pro_ladestand
            name: Akku
            color:
              charging: "#3498DB"
              discharging: "#E67E22"
          home:
            entity: sensor.system_balkonkraft_stesch_hausbedarf
            name: Haus
            color: "#9B59B6"
        watt_threshold: 1000
        clickable_entities: true
        display_zero_lines: true
        use_new_flow_rate_model: true
        min_flow_rate: 0.3
        max_flow_rate: 2.5

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 4 · SOLAR TAGESVERLAUF + ALLE PV KANÄLE        │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:apexcharts-card
        header:
          show: true
          title: ☀️ Solarleistung heute – Alle 4 PV-Kanäle
          show_states: true
          colorize_states: true
        graph_span: 24h
        span:
          start: day
        all_series_config:
          stroke_width: 2
          fill_raw: "0"
        series:
          - entity: sensor.solarbank_3_e2700_pro_solarleistung
            name: ☀ Gesamt
            color: "#FFB700"
            type: area
            opacity: 0.25
            stroke_width: 3
          - entity: sensor.solarbank_3_e2700_pro_solar_pv1
            name: PV1 (Nord)
            color: "#FF6B35"
            type: area
            opacity: 0.15
          - entity: sensor.solarbank_3_e2700_pro_solar_pv2
            name: PV2 (Süd)
            color: "#2ECC71"
            type: area
            opacity: 0.15
          - entity: sensor.solarbank_3_e2700_pro_solar_pv3
            name: PV3 (Ost)
            color: "#3498DB"
            type: area
            opacity: 0.15
          - entity: sensor.solarbank_3_e2700_pro_solar_pv4
            name: PV4 (West)
            color: "#9B59B6"
            type: area
            opacity: 0.15
        yaxis:
          - min: 0
            decimals: 0
            apex_config:
              title:
                text: Watt (W)
        apex_config:
          chart:
            background: transparent
          theme:
            mode: dark
          annotations:
            yaxis:
              - y: 200
                borderColor: "#FFB700"
                label:
                  text: Einspeisevorgabe 200W
                  style:
                    color: "#FFB700"
                    background: transparent

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 5 · PV BALKENDIAGRAMM (Farbe je Kanal)         │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:apexcharts-card
        header:
          show: true
          title: 🔆 PV Kanäle – Aktueller Vergleich (Balken)
          show_states: true
          colorize_states: true
        chart_type: bar
        series:
          - entity: sensor.solarbank_3_e2700_pro_solar_pv1
            name: PV1
            color: "#FF6B35"
            data_generator: |
              return [[Date.now(), entity.state]];
          - entity: sensor.solarbank_3_e2700_pro_solar_pv2
            name: PV2
            color: "#2ECC71"
            data_generator: |
              return [[Date.now(), entity.state]];
          - entity: sensor.solarbank_3_e2700_pro_solar_pv3
            name: PV3
            color: "#3498DB"
            data_generator: |
              return [[Date.now(), entity.state]];
          - entity: sensor.solarbank_3_e2700_pro_solar_pv4
            name: PV4
            color: "#9B59B6"
            data_generator: |
              return [[Date.now(), entity.state]];
        apex_config:
          chart:
            background: transparent
          theme:
            mode: dark
          plotOptions:
            bar:
              distributed: true
              borderRadius: 6
              dataLabels:
                position: top
          dataLabels:
            enabled: true
            formatter: "function(val) { return val + ' W' }"
            offsetY: -20
            style:
              fontSize: 13px
              colors: ["#fff"]
          xaxis:
            categories: ["PV1", "PV2", "PV3", "PV4"]
          legend:
            show: false
          yaxis:
            min: 0
            title:
              text: Watt (W)

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 6 · PV VERLAUF 7 TAGE (Balkendiagramm täglich) │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:apexcharts-card
        header:
          show: true
          title: 📊 Solar PV – Tagesertrag letzte 7 Tage (Balken)
          show_states: true
          colorize_states: true
        graph_span: 7d
        span:
          end: now
        chart_type: bar
        all_series_config:
          group_by:
            func: max
            duration: 1d
          stroke_width: 0
        series:
          - entity: sensor.solarbank_3_e2700_pro_solar_pv1
            name: PV1
            color: "#FF6B35"
            type: column
          - entity: sensor.solarbank_3_e2700_pro_solar_pv2
            name: PV2
            color: "#2ECC71"
            type: column
          - entity: sensor.solarbank_3_e2700_pro_solar_pv3
            name: PV3
            color: "#3498DB"
            type: column
          - entity: sensor.solarbank_3_e2700_pro_solar_pv4
            name: PV4
            color: "#9B59B6"
            type: column
          - entity: sensor.solarbank_3_e2700_pro_solarleistung
            name: Gesamt Max
            color: "#FFB700"
            type: line
            stroke_width: 3
        apex_config:
          chart:
            background: transparent
          theme:
            mode: dark
          plotOptions:
            bar:
              borderRadius: 4
              columnWidth: 60%
          yaxis:
            min: 0
            title:
              text: Max Watt (W)

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 7 · AKKU GAUGE + DETAILS (2 Spalten)           │
      # └─────────────────────────────────────────────────────────┘
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.solarbank_3_e2700_pro_ladestand
            name: 🔋 Akku Ladestand
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 50
            min: 0
            max: 100

          - type: custom:apexcharts-card
            header:
              show: true
              title: 🔋 Akku Energiefluss heute
            graph_span: 24h
            span:
              start: day
            series:
              - entity: sensor.solarbank_3_e2700_pro_ladestand
                name: Ladestand %
                color: "#3498DB"
                type: area
                fill_raw: "0"
                opacity: 0.3
                stroke_width: 3
                yaxis_id: percent
              - entity: sensor.solarbank_3_e2700_pro_batterie_ausgang
                name: Entladung W
                color: "#E74C3C"
                type: line
                stroke_width: 2
                yaxis_id: watt
              - entity: sensor.solarbank_3_e2700_pro_netzaufladung
                name: Netzladung W
                color: "#9B59B6"
                type: line
                stroke_width: 2
                yaxis_id: watt
            yaxis:
              - id: percent
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  title:
                    text: "Ladestand (%)"
              - id: watt
                opposite: true
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: "Leistung (W)"
            apex_config:
              chart:
                background: transparent
              theme:
                mode: dark

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 8 · NETZ BEZUG / EINSPEISUNG HEUTE             │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:apexcharts-card
        header:
          show: true
          title: 🔌 Stromnetz – Bezug & Einspeisung heute
          show_states: true
          colorize_states: true
        graph_span: 24h
        span:
          start: day
        series:
          - entity: sensor.smart_meter_netzbezug
            name: Netzbezug
            color: "#E74C3C"
            type: area
            fill_raw: "0"
            stroke_width: 2
            opacity: 0.35
          - entity: sensor.smart_meter_netzeinspeisung
            name: Netzeinspeisung
            color: "#2ECC71"
            type: area
            fill_raw: "0"
            stroke_width: 2
            opacity: 0.35
          - entity: sensor.system_balkonkraft_stesch_hausbedarf
            name: Hausbedarf
            color: "#9B59B6"
            type: line
            stroke_width: 2
        apex_config:
          chart:
            background: transparent
          theme:
            mode: dark
          fill:
            type: gradient
          tooltip:
            shared: true
          yaxis:
            min: 0
            title:
              text: Watt (W)

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 9 · NETZ WOCHE BALKEN (täglich gestapelt)      │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:apexcharts-card
        header:
          show: true
          title: 📊 Netz Woche – Bezug vs. Einspeisung (Tageswerte)
          show_states: true
          colorize_states: true
        graph_span: 7d
        span:
          end: now
        chart_type: bar
        all_series_config:
          group_by:
            func: max
            duration: 1d
        series:
          - entity: sensor.smart_meter_netzbezug
            name: Bezug (W)
            color: "#E74C3C"
            type: column
          - entity: sensor.smart_meter_netzeinspeisung
            name: Einspeisung (W)
            color: "#2ECC71"
            type: column
        apex_config:
          chart:
            background: transparent
          theme:
            mode: dark
          plotOptions:
            bar:
              borderRadius: 4
              columnWidth: 60%
          yaxis:
            min: 0
            title:
              text: Max Watt (W)

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 10 · REKORDE & TAGES-MAXIMA                    │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:stack-in-card
        mode: vertical
        cards:
          - type: markdown
            content: >
              ## 🏆 Rekorde & Statistiken
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.system_balkonkraft_stesch_ertrag_gesamt') | float | round(1) }} kWh"
                secondary: ⚡ Gesamtertrag
                icon: mdi:lightning-bolt-circle
                icon_color: amber
                entity: sensor.system_balkonkraft_stesch_ertrag_gesamt
                layout: vertical
                fill_container: true

              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.system_balkonkraft_stesch_kostenersparnis') | float | round(2) }} €"
                secondary: 💰 Ersparnis gesamt
                icon: mdi:piggy-bank-outline
                icon_color: green
                entity: sensor.system_balkonkraft_stesch_kostenersparnis
                layout: vertical
                fill_container: true

              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.system_balkonkraft_stesch_ai_profit') | float | round(2) }} €"
                secondary: 🤖 AI Profit
                icon: mdi:robot-excited
                icon_color: purple
                entity: sensor.system_balkonkraft_stesch_ai_profit
                layout: vertical
                fill_container: true

              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.system_balkonkraft_stesch_co2_einsparung') | float | round(1) }} kg"
                secondary: 🌿 CO₂ gespart
                icon: mdi:molecule-co2
                icon_color: teal
                entity: sensor.system_balkonkraft_stesch_co2_einsparung
                layout: vertical
                fill_container: true

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 11 · STATISTIK BALKENDIAGRAMM (Rekord-Ansicht) │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:apexcharts-card
        header:
          show: true
          title: 📈 Balkonkraft – Wirtschaftlichkeit Übersicht
          show_states: true
          colorize_states: true
        chart_type: bar
        series:
          - entity: sensor.system_balkonkraft_stesch_kostenersparnis
            name: Ersparnis (€)
            color: "#2ECC71"
            data_generator: |
              return [[Date.now(), entity.state]];
          - entity: sensor.system_balkonkraft_stesch_ai_profit
            name: AI Profit (€)
            color: "#9B59B6"
            data_generator: |
              return [[Date.now(), entity.state]];
        apex_config:
          chart:
            background: transparent
          theme:
            mode: dark
          plotOptions:
            bar:
              distributed: false
              borderRadius: 6
              horizontal: true
              dataLabels:
                position: end
          dataLabels:
            enabled: true
            formatter: "function(val) { return val + ' €' }"
            style:
              fontSize: 13px
          xaxis:
            title:
              text: Euro (€)
          legend:
            show: true

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 12 · PV STATISTIK (statistics-graph builtin)   │
      # └─────────────────────────────────────────────────────────┘
      - type: statistics-graph
        title: 📉 Solar – Statistik letzte 30 Tage (Max pro Tag)
        entities:
          - entity: sensor.solarbank_3_e2700_pro_solarleistung
            name: Solar Gesamt
          - entity: sensor.solarbank_3_e2700_pro_solar_pv1
            name: PV1
          - entity: sensor.solarbank_3_e2700_pro_solar_pv2
            name: PV2
          - entity: sensor.solarbank_3_e2700_pro_solar_pv3
            name: PV3
          - entity: sensor.solarbank_3_e2700_pro_solar_pv4
            name: PV4
        days_to_show: 30
        period: day
        stat_types:
          - max
          - mean
        chart_type: bar

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 13 · NETZ STATISTIK 30 TAGE                    │
      # └─────────────────────────────────────────────────────────┘
      - type: statistics-graph
        title: 📉 Netz Statistik – 30 Tage Übersicht
        entities:
          - entity: sensor.smart_meter_netzbezug
            name: Netzbezug
          - entity: sensor.smart_meter_netzeinspeisung
            name: Einspeisung
          - entity: sensor.system_balkonkraft_stesch_hausbedarf
            name: Hausbedarf
        days_to_show: 30
        period: day
        stat_types:
          - max
          - mean
        chart_type: bar

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 14 · MINI SPARKLINES 7 TAGE (3er Reihe)        │
      # └─────────────────────────────────────────────────────────┘
      - type: horizontal-stack
        cards:
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.solarbank_3_e2700_pro_solarleistung
                name: Solar
                color: "#FFB700"
            name: ☀️ Solar 7 Tage
            hours_to_show: 168
            points_per_hour: 1
            line_width: 2
            color: "#FFB700"
            fill: true
            show:
              icon: true
              state: true
              legend: false
              fill: fade
              extrema: true
            card_mod:
              style: |
                ha-card { background: linear-gradient(135deg,#1a1a2e,#16213e); border-radius:16px; }

          - type: custom:mini-graph-card
            entities:
              - entity: sensor.smart_meter_netzbezug
                name: Netzbezug
                color: "#E74C3C"
            name: 🔌 Netz 7 Tage
            hours_to_show: 168
            points_per_hour: 1
            line_width: 2
            color: "#E74C3C"
            fill: true
            show:
              icon: true
              state: true
              legend: false
              fill: fade
              extrema: true

          - type: custom:mini-graph-card
            entities:
              - entity: sensor.solarbank_3_e2700_pro_ladestand
                name: Akku
                color: "#3498DB"
            name: 🔋 Akku 7 Tage
            hours_to_show: 168
            points_per_hour: 1
            line_width: 2
            color: "#3498DB"
            fill: true
            show:
              icon: true
              state: true
              legend: false
              fill: fade
              extrema: true

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 15 · TAGES-MAXIMA KOMPAKT (Heute vs. gestern)  │
      # └─────────────────────────────────────────────────────────┘
      - type: custom:apexcharts-card
        header:
          show: true
          title: 🆚 Heute vs. Gestern – PV Maximalleistung
          show_states: true
          colorize_states: true
        graph_span: 48h
        span:
          end: now
        chart_type: bar
        all_series_config:
          group_by:
            func: max
            duration: 1d
        series:
          - entity: sensor.solarbank_3_e2700_pro_solarleistung
            name: Solar Gesamt
            color: "#FFB700"
            type: column
          - entity: sensor.solarbank_3_e2700_pro_solar_pv1
            name: PV1
            color: "#FF6B35"
            type: column
          - entity: sensor.solarbank_3_e2700_pro_solar_pv2
            name: PV2
            color: "#2ECC71"
            type: column
          - entity: sensor.solarbank_3_e2700_pro_solar_pv3
            name: PV3
            color: "#3498DB"
            type: column
          - entity: sensor.solarbank_3_e2700_pro_solar_pv4
            name: PV4
            color: "#9B59B6"
            type: column
        apex_config:
          chart:
            background: transparent
          theme:
            mode: dark
          plotOptions:
            bar:
              borderRadius: 5
              columnWidth: 55%
          yaxis:
            min: 0
            title:
              text: Max Watt (W)
          xaxis:
            labels:
              formatter: "function(val) { var d = new Date(val); return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}); }"

      # ┌─────────────────────────────────────────────────────────┐
      # │  SEKTION 16 · SOLARBANK STEUERUNG                       │
      # └─────────────────────────────────────────────────────────┘
      - type: entities
        title: ⚙️ Solarbank Steuerung
        icon: mdi:solar-panel-large
        show_header_toggle: false
        entities:
          - entity: select.solarbank_3_e2700_pro_benutzermodus
            name: Benutzermodus
            icon: mdi:tune
